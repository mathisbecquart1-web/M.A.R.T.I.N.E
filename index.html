<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorateur de bâtiments CSV</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-o9N1j7kGStb6fE22E1jPfU2VHNxjS1O+jfXqdP6rJTg=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg: #f4f6fb;
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --text: #1f2937;
            --muted: #6b7280;
            --card: #ffffff;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        header {
            padding: 18px 24px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 20;
        }
        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
        }
        .subtitle { color: var(--muted); font-size: 14px; }
        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            padding: 16px;
            height: calc(100vh - 84px);
        }
        #map { height: 100%; width: 100%; border-radius: 14px; box-shadow: 0 10px 24px rgba(0,0,0,0.08); }
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .section-title { margin: 10px 0 6px; font-weight: 700; font-size: 15px; }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        .control-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        input[type="file"] { padding: 6px; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; }
        button {
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        button.primary { background: var(--primary); color: white; box-shadow: 0 6px 12px rgba(59, 130, 246, 0.3); }
        button.secondary { background: #e5e7eb; color: var(--text); }
        button.danger { background: #ef4444; color: white; }
        button:active { transform: translateY(1px); }
        .status { font-size: 12px; color: var(--muted); }
        .list { margin: 8px 0; border: 1px solid var(--border); border-radius: 10px; overflow: auto; max-height: 220px; }
        .list-item { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s ease; }
        .list-item:hover { background: #f8fafc; }
        .list-item.active { background: #eef2ff; border-left: 3px solid var(--primary); }
        .empty { padding: 12px; text-align: center; color: var(--muted); }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #eef2ff; color: var(--primary-dark); font-weight: 600; font-size: 12px; margin-left: 6px; }
        .detail { flex: 1; overflow: auto; border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
        .detail h3 { margin: 0 0 8px; }
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
        .detail-item { background: #f8fafc; border-radius: 8px; padding: 8px; border: 1px solid #edf2f7; }
        .detail-key { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
        .detail-value { font-weight: 600; }
        .map-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .pill { border-radius: 999px; padding: 8px 12px; background: #f8fafc; border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 6px; }
        .save-indicator { font-size: 12px; color: var(--muted); }
        @media(max-width: 1000px) { .container { grid-template-columns: 1fr; height: auto; } #map { height: 360px; } }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Explorateur de bâtiments CSV</h1>
            <div class="subtitle">Importez votre CSV, filtrez, recherchez et conservez votre session automatiquement.</div>
        </div>
        <div class="save-indicator" id="saveIndicator">État non sauvegardé</div>
    </header>
    <div class="container">
        <div class="panel">
            <div id="map"></div>
            <div class="map-tools">
                <button class="secondary" id="toggleBase">Basculer fond : <span id="baseLabel">Réaliste</span></button>
                <button class="secondary" id="fitVisible">Voir tous les bâtiments</button>
            </div>
        </div>
        <div class="panel">
            <div class="controls">
                <div class="section-title">Import / données</div>
                <div class="control-row">
                    <input type="file" id="fileInput" accept=".csv">
                    <button class="secondary" id="loadSample">Charger un exemple</button>
                    <button class="danger" id="resetData">Réinitialiser</button>
                </div>
                <div class="section-title">Recherche et filtres</div>
                <input type="text" id="searchInput" placeholder="Rechercher dans toutes les colonnes...">
                <select id="typeFilter">
                    <option value="">Filtrer par type</option>
                </select>
                <div class="status" id="resultCount">Aucun bâtiment chargé.</div>
                <div class="list" id="resultsList"><div class="empty">Importez un CSV pour commencer.</div></div>
                <div class="section-title">Fiche détaillée</div>
                <div class="detail" id="detailPanel"><div class="empty">Sélectionnez un bâtiment sur la carte ou la liste.</div></div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'building-explorer-state-v1';
        let map, baseLayers, markersLayer;
        let buildings = [];
        let filtered = [];
        let selectedId = null;
        const fileInput = document.getElementById('fileInput');
        const searchInput = document.getElementById('searchInput');
        const typeFilter = document.getElementById('typeFilter');
        const resultsList = document.getElementById('resultsList');
        const detailPanel = document.getElementById('detailPanel');
        const resultCount = document.getElementById('resultCount');
        const toggleBaseBtn = document.getElementById('toggleBase');
        const baseLabel = document.getElementById('baseLabel');
        const fitVisibleBtn = document.getElementById('fitVisible');
        const resetBtn = document.getElementById('resetData');
        const loadSampleBtn = document.getElementById('loadSample');
        const saveIndicator = document.getElementById('saveIndicator');

        function initMap() {
            map = L.map('map');
            const realistic = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributeurs'
            });
            const schematic = L.tileLayer('https://{s}.tile.stamen.com/toner-lite/{z}/{x}/{y}.png', {
                attribution: 'Map tiles by Stamen Design'
            });
            baseLayers = { realistic, schematic };
            realistic.addTo(map);
            markersLayer = L.layerGroup().addTo(map);
            map.setView([46.8, 2.5], 6);
            map.on('moveend zoomend', persistState);
        }

        function persistState() {
            const state = {
                buildings,
                search: searchInput.value,
                filter: typeFilter.value,
                base: currentBase(),
                map: { center: map.getCenter(), zoom: map.getZoom() },
                selectedId
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            saveIndicator.textContent = 'État sauvegardé';
        }

        function currentBase() {
            return map.hasLayer(baseLayers.realistic) ? 'realistic' : 'schematic';
        }

        function restoreState() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return false;
            try {
                const state = JSON.parse(raw);
                buildings = state.buildings || [];
                searchInput.value = state.search || '';
                typeFilter.value = state.filter || '';
                selectedId = state.selectedId ?? null;
                setBaseLayer(state.base === 'schematic' ? 'schematic' : 'realistic');
                if (state.map) {
                    map.setView([state.map.center.lat, state.map.center.lng], state.map.zoom);
                }
                refreshUI();
                saveIndicator.textContent = 'Session restaurée';
                return true;
            } catch (e) {
                console.error('Restore failed', e);
                return false;
            }
        }

        function setBaseLayer(key) {
            Object.values(baseLayers).forEach(layer => map.removeLayer(layer));
            baseLayers[key].addTo(map);
            baseLabel.textContent = key === 'schematic' ? 'Schématique' : 'Réaliste';
            persistState();
        }

        function parseCSV(text) {
            const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
            const rows = parsed.data;
            const clean = [];
            rows.forEach((row, idx) => {
                const lon = parseFloat(row.Lon ?? row.lon ?? row.longitude ?? row.lng);
                const lat = parseFloat(row.Lat ?? row.lat ?? row.latitude ?? row.latit);
                if (Number.isFinite(lon) && Number.isFinite(lat)) {
                    clean.push({ ...row, Lon: lon, Lat: lat, __id: `${Date.now()}-${idx}` });
                }
            });
            buildings = clean;
            selectedId = null;
            buildFilters();
            refreshUI();
            persistState();
        }

        function buildFilters() {
            const values = new Set();
            buildings.forEach(b => {
                if (b.Type || b.type) values.add(b.Type || b.type);
            });
            const current = typeFilter.value;
            typeFilter.innerHTML = '<option value="">Filtrer par type</option>';
            [...values].sort().forEach(v => {
                const opt = document.createElement('option');
                opt.value = v;
                opt.textContent = v;
                typeFilter.appendChild(opt);
            });
            if ([...values].includes(current)) typeFilter.value = current; else typeFilter.value = '';
        }

        function applyFilters() {
            const query = searchInput.value.toLowerCase().trim();
            const filterVal = typeFilter.value;
            filtered = buildings.filter(b => {
                if (filterVal && (b.Type || b.type) !== filterVal) return false;
                if (!query) return true;
                return Object.keys(b).some(key => {
                    if (['Lon','Lat','__id'].includes(key)) return false;
                    return String(b[key] ?? '').toLowerCase().includes(query);
                });
            });
        }

        function refreshUI() {
            applyFilters();
            renderMarkers();
            renderList();
            renderDetail();
            resultCount.textContent = filtered.length ? `${filtered.length} bâtiment(s) affiché(s)` : 'Aucun bâtiment trouvé';
        }

        function renderMarkers() {
            markersLayer.clearLayers();
            if (!filtered.length) return;
            const bounds = [];
            filtered.forEach(b => {
                const marker = L.marker([b.Lat, b.Lon]).addTo(markersLayer);
                marker.on('click', () => { selectedId = b.__id; renderDetail(); highlightSelection(); persistState(); });
                bounds.push([b.Lat, b.Lon]);
            });
            if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });
        }

        function renderList() {
            resultsList.innerHTML = '';
            if (!filtered.length) {
                resultsList.innerHTML = '<div class="empty">Aucun bâtiment à afficher.</div>';
                return;
            }
            filtered.forEach(b => {
                const item = document.createElement('div');
                item.dataset.id = b.__id;
                item.className = 'list-item' + (b.__id === selectedId ? ' active' : '');
                const label = b.Nom || b.name || b.Titre || 'Bâtiment';
                item.innerHTML = `<div><strong>${label}</strong> ${b.Type || b.type ? `<span class="badge">${b.Type || b.type}</span>` : ''}</div><div class="status">${b.Ville || b.City || ''}</div>`;
                item.addEventListener('click', () => {
                    selectedId = b.__id;
                    map.setView([b.Lat, b.Lon], Math.max(map.getZoom(), 14));
                    renderDetail();
                    highlightSelection();
                    persistState();
                });
                resultsList.appendChild(item);
            });
        }

        function renderDetail() {
            const current = buildings.find(b => b.__id === selectedId);
            if (!current) {
                detailPanel.innerHTML = '<div class="empty">Sélectionnez un bâtiment sur la carte ou la liste.</div>';
                return;
            }
            const title = current.Nom || current.name || current.Titre || 'Bâtiment sélectionné';
            const entries = Object.entries(current).filter(([k]) => !['__id'].includes(k));
            const grid = entries.map(([k,v]) => `<div class="detail-item"><div class="detail-key">${k}</div><div class="detail-value">${v || '—'}</div></div>`).join('');
            detailPanel.innerHTML = `<h3>${title}</h3><div class="detail-grid">${grid}</div>`;
        }

        function highlightSelection() {
            [...resultsList.querySelectorAll('.list-item')].forEach(item => {
                item.classList.toggle('active', item.dataset.id === selectedId);
            });
        }

        function loadSample() {
            const sample = `Nom,Type,Ville,Adresse,Lon,Lat\nCampus Central,Université,Paris,10 Rue de Rivoli,2.3522,48.8566\nTour Sud,Bureau,Lyon,5 Quai Jules Courmont,4.8357,45.7640\nAtelier Nord,Industriel,Lille,12 Rue Nationale,3.0573,50.6292\nPavillon Bleu,Culture,Marseille,14 Quai du Port,5.3698,43.2965\nMaison des Arts,Culture,Bordeaux,2 Place de la Bourse,-0.5667,44.8378`;
            parseCSV(sample);
        }

        function resetData() {
            localStorage.removeItem(STORAGE_KEY);
            buildings = [];
            filtered = [];
            selectedId = null;
            searchInput.value = '';
            typeFilter.innerHTML = '<option value="">Filtrer par type</option>';
            resultsList.innerHTML = '<div class="empty">Importez un CSV pour commencer.</div>';
            detailPanel.innerHTML = '<div class="empty">Sélectionnez un bâtiment sur la carte ou la liste.</div>';
            resultCount.textContent = 'Aucun bâtiment chargé.';
            markersLayer.clearLayers();
            map.setView([46.8, 2.5], 6);
            saveIndicator.textContent = 'État réinitialisé';
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => parseCSV(ev.target.result);
            reader.readAsText(file, 'utf-8');
        });

        searchInput.addEventListener('input', () => { refreshUI(); persistState(); });
        typeFilter.addEventListener('change', () => { refreshUI(); persistState(); });
        toggleBaseBtn.addEventListener('click', () => {
            const next = currentBase() === 'realistic' ? 'schematic' : 'realistic';
            setBaseLayer(next);
        });
        fitVisibleBtn.addEventListener('click', () => {
            if (!filtered.length) return;
            const bounds = filtered.map(b => [b.Lat, b.Lon]);
            map.fitBounds(bounds, { padding: [30, 30] });
        });
        resetBtn.addEventListener('click', resetData);
        loadSampleBtn.addEventListener('click', loadSample);

        window.addEventListener('beforeunload', persistState);

        initMap();
        if (!restoreState()) {
            loadSample();
            saveIndicator.textContent = 'Exemple chargé';
        }
    </script>
</body>
</html>
