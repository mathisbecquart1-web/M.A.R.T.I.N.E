<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Interactive Hauts-de-France & Normandie</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #map { height: 70vh; width: 100%; }
        #search-panel { 
            padding: 20px; 
            background: #f4f4f4; 
            border-bottom: 1px solid #ddd; 
        }
        .search-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #search-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .btn {
            padding: 10px 20px;
            background: #007cba;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover { background: #005a87; }
        #file-input { margin-left: 10px; }
    </style>
</head>
<body>
    <div id="search-panel">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Rechercher un bâtiment ou propriétaire...">
            <button class="btn" onclick="searchBuildings()">Rechercher</button>
            <input type="file" id="file-input" accept=".csv,.json" onchange="importData(event)">
            <button class="btn" onclick="document.getElementById('file-input').click()">Importer données</button>
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialisation de la carte centrée sur les régions
        const map = L.map('map').setView([49.5, 2.8], 8);
        
        // Ajout de la couche de tuiles OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Stockage des données de bâtiments
        let buildingsData = [];
        let markersLayer = L.layerGroup().addTo(map);

        // Fonction pour ajouter un marqueur
        function addMarker(building) {
            const marker = L.marker([building.lat, building.lng])
                .bindPopup(`
                    <strong>${building.nom}</strong><br>
                    Propriétaire: ${building.proprietaire}<br>
                    Adresse: ${building.adresse}<br>
                    Type: ${building.type || 'Non spécifié'}
                `);
            markersLayer.addLayer(marker);
            return marker;
        }

        // Fonction de recherche
        function searchBuildings() {
            const query = document.getElementById('search-input').value.toLowerCase();
            markersLayer.clearLayers();
            
            const filteredBuildings = buildingsData.filter(building => 
                building.nom.toLowerCase().includes(query) ||
                building.proprietaire.toLowerCase().includes(query) ||
                building.adresse.toLowerCase().includes(query)
            );

            filteredBuildings.forEach(building => addMarker(building));
            
            if (filteredBuildings.length > 0) {
                const group = new L.featureGroup(markersLayer.getLayers());
                map.fitBounds(group.getBounds());
            }
        }

        // Fonction d'import de données
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    if (file.name.endsWith('.json')) {
                        const data = JSON.parse(e.target.result);
                        processImportedData(data);
                    } else if (file.name.endsWith('.csv')) {
                        const csv = e.target.result;
                        const data = parseCSV(csv);
                        processImportedData(data);
                    }
                } catch (error) {
                    alert('Erreur lors de l\'import: ' + error.message);
                }
            };
            reader.readAsText(file);
        }

        // Traitement des données importées
        function processImportedData(data) {
            buildingsData = data
                .map(normalizeBuilding)
                .filter(item => Number.isFinite(item.lat) && Number.isFinite(item.lng));

            markersLayer.clearLayers();

            buildingsData.forEach(building => addMarker(building));
            alert(`${buildingsData.length} bâtiments importés avec succès!`);
        }

        // Parser CSV simple
        function parseCSV(csv) {
            const lines = csv.split(/\r?\n/).filter(line => line.trim());
            if (lines.length === 0) return [];

            const delimiter = detectDelimiter(lines[0]);
            const headers = lines[0].split(delimiter).map(h => h.trim());
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;

                const rawValues = lines[i].split(delimiter).map(v => v.trim());
                const item = {};

                headers.forEach((header, index) => {
                    item[header] = convertDecimalComma(rawValues[index] || '');
                });

                data.push(item);
            }
            return data;
        }

        function detectDelimiter(line) {
            const candidates = [';', '\t', ','];
            let bestDelimiter = ',';
            let bestCount = 0;

            candidates.forEach(delimiter => {
                const count = line.split(delimiter).length;
                if (count > bestCount) {
                    bestCount = count;
                    bestDelimiter = delimiter;
                }
            });

            return bestDelimiter;
        }

        function convertDecimalComma(value) {
            if (typeof value === 'number') return value;
            if (typeof value !== 'string') return value;

            const normalized = value.replace(',', '.');
            const num = parseFloat(normalized);
            return Number.isFinite(num) && normalized.match(/^-?\d+(\.\d+)?$/) ? num : value;
        }

        function normalizeBuilding(raw) {
            const lat = extractCoordinate(raw, ['lat', 'latitude', 'y'], true);
            const lng = extractCoordinate(raw, ['lng', 'lon', 'longitude', 'x'], false);

            const fallbackCoords = findFallbackCoords(raw, lat, lng);

            return {
                nom: raw.nom || raw.name || 'Bâtiment sans nom',
                proprietaire: raw.proprietaire || raw.owner || 'Propriétaire inconnu',
                adresse: raw.adresse || raw.address || 'Adresse inconnue',
                type: raw.type || raw.categorie || '',
                lat: lat ?? fallbackCoords.lat,
                lng: lng ?? fallbackCoords.lng
            };
        }

        function extractCoordinate(item, keys, isLat) {
            for (const key of keys) {
                if (key in item) {
                    const value = convertDecimalComma(item[key]);
                    if (Number.isFinite(value)) return value;
                }
            }
            return null;
        }

        function findFallbackCoords(item, lat, lng) {
            const numericValues = Object.values(item)
                .map(convertDecimalComma)
                .filter(value => Number.isFinite(value));

            if (numericValues.length >= 2) {
                const [potentialLng, potentialLat] = numericValues.slice(-2);
                return {
                    lat: lat ?? potentialLat,
                    lng: lng ?? potentialLng
                };
            }

            return { lat: lat ?? null, lng: lng ?? null };
        }

        // Données d'exemple
        const exempleData = [
            {
                nom: "Mairie de Lille",
                proprietaire: "Ville de Lille",
                adresse: "Place Augustin Laurent, Lille",
                lat: 50.6292,
                lng: 3.0573,
                type: "Bâtiment public"
            },
            {
                nom: "Cathédrale de Rouen",
                proprietaire: "État français",
                adresse: "Place de la Cathédrale, Rouen",
                lat: 49.4404,
                lng: 1.0940,
                type: "Monument historique"
            }
        ];

        // Chargement des données d'exemple
        buildingsData = exempleData;
        exempleData.forEach(building => addMarker(building));
    </script>
</body>
</html>
