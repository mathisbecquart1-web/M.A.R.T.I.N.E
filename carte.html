<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Interactive Hauts-de-France & Normandie</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #map { height: 70vh; width: 100%; }
        #search-panel { 
            padding: 20px; 
            background: #f4f4f4; 
            border-bottom: 1px solid #ddd; 
        }
        .search-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #search-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .btn {
            padding: 10px 20px;
            background: #007cba;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover { background: #005a87; }
        #file-input { margin-left: 10px; }
    </style>
</head>
<body>
    <div id="search-panel">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Rechercher un bâtiment ou propriétaire...">
            <button class="btn" onclick="searchBuildings()">Rechercher</button>
            <input type="file" id="file-input" accept=".csv,.json,.txt" onchange="importData(event)">
            <button class="btn" onclick="document.getElementById('file-input').click()">Importer données</button>
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialisation de la carte centrée sur les régions
        const map = L.map('map').setView([49.5, 2.8], 8);
        
        // Ajout de la couche de tuiles OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Stockage des données de bâtiments
        let buildingsData = [];
        let markersLayer = L.layerGroup().addTo(map);

        function parseNumber(value) {
            if (typeof value === 'number') return value;
            if (!value) return null;

            const normalized = value.toString().replace(',', '.');
            const parsed = parseFloat(normalized);

            return isNaN(parsed) ? null : parsed;
        }

        function extractCoordinates(item) {
            const coordinateKeys = ['coordonnees', 'coordinates', 'coords'];

            for (const key of coordinateKeys) {
                if (item[key]) {
                    const matches = item[key].toString().match(/-?\d+(?:[.,]\d+)?/g);
                    if (matches && matches.length >= 2) {
                        const lng = parseNumber(matches[matches.length - 2]);
                        const lat = parseNumber(matches[matches.length - 1]);

                        if (lat !== null && lng !== null) {
                            return { lat, lng };
                        }
                    }
                }
            }

            return null;
        }

        function normalizeBuilding(entry) {
            const building = { ...entry };

            const latKeys = ['lat', 'latitude'];
            const lngKeys = ['lng', 'lon', 'longitude'];

            if (building.lat === undefined) {
                const latKey = latKeys.find(key => entry[key] !== undefined);
                if (latKey) building.lat = entry[latKey];
            }

            if (building.lng === undefined) {
                const lngKey = lngKeys.find(key => entry[key] !== undefined);
                if (lngKey) building.lng = entry[lngKey];
            }

            if (building.lat === undefined || building.lng === undefined) {
                const coords = extractCoordinates(entry);
                if (coords) {
                    building.lat = coords.lat;
                    building.lng = coords.lng;
                }
            }

            building.lat = parseNumber(building.lat);
            building.lng = parseNumber(building.lng);

            return building;
        }

        // Fonction pour ajouter un marqueur
        function addMarker(building) {
            const marker = L.marker([building.lat, building.lng])
                .bindPopup(`
                    <strong>${building.nom || 'Bâtiment'}</strong><br>
                    Propriétaire: ${building.proprietaire || 'Non précisé'}<br>
                    Adresse: ${building.adresse || 'Non précisée'}<br>
                    Type: ${building.type || 'Non spécifié'}
                `);
            markersLayer.addLayer(marker);
            return marker;
        }

        // Fonction de recherche
        function searchBuildings() {
            const query = document.getElementById('search-input').value.toLowerCase();
            markersLayer.clearLayers();
            
            const filteredBuildings = buildingsData.filter(building =>
                (building.nom || '').toLowerCase().includes(query) ||
                (building.proprietaire || '').toLowerCase().includes(query) ||
                (building.adresse || '').toLowerCase().includes(query)
            );

            filteredBuildings.forEach(building => addMarker(building));
            
            if (filteredBuildings.length > 0) {
                const group = new L.featureGroup(markersLayer.getLayers());
                map.fitBounds(group.getBounds());
            }
        }

        // Fonction d'import de données
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    if (file.name.endsWith('.json')) {
                        const data = JSON.parse(e.target.result);
                        processImportedData(data);
                    } else if (file.name.endsWith('.csv') || file.name.endsWith('.txt')) {
                        const csv = e.target.result;
                        const data = parseCSV(csv);
                        processImportedData(data);
                    }
                } catch (error) {
                    alert('Erreur lors de l\'import: ' + error.message);
                }
            };
            reader.readAsText(file);
        }

        // Traitement des données importées
        function processImportedData(data) {
            buildingsData = data.map(normalizeBuilding)
                .filter(item => typeof item.lat === 'number' && typeof item.lng === 'number');
            markersLayer.clearLayers();

            buildingsData.forEach(building => addMarker(building));
            alert(`${buildingsData.length} bâtiments importés avec succès!`);
        }

        // Parser CSV simple
        function parseCSV(csv) {
            const lines = csv.split('\n').filter(Boolean);
            if (lines.length === 0) return [];

            const delimiterCandidates = [',', ';', '\t'];
            const delimiter = delimiterCandidates.reduce((best, current) => {
                const currentCount = (lines[0].match(new RegExp(current, 'g')) || []).length;
                const bestCount = (lines[0].match(new RegExp(best, 'g')) || []).length;
                return currentCount > bestCount ? current : best;
            }, ',');

            const headers = lines[0].split(delimiter).map(h => h.trim());
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                if (lines[i].trim()) {
                    const values = lines[i].split(delimiter).map(v => v.trim());
                    const item = {};
                    headers.forEach((header, index) => {
                        item[header] = values[index] || '';
                    });
                    data.push(item);
                }
            }
            return data;
        }

        // Données d'exemple
        const exempleData = [
            {
                nom: "Mairie de Lille",
                proprietaire: "Ville de Lille",
                adresse: "Place Augustin Laurent, Lille",
                lat: 50.6292,
                lng: 3.0573,
                type: "Bâtiment public"
            },
            {
                nom: "Cathédrale de Rouen",
                proprietaire: "État français",
                adresse: "Place de la Cathédrale, Rouen",
                lat: 49.4404,
                lng: 1.0940,
                type: "Monument historique"
            }
        ];

        // Chargement des données d'exemple
        buildingsData = exempleData;
        exempleData.forEach(building => addMarker(building));
    </script>
</body>
</html>
