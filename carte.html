<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Interactive Hauts-de-France & Normandie</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        :root {
            --bg: #0f172a;
            --panel: #ffffff;
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
            --muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.15), transparent 30%),
                        radial-gradient(circle at 80% 0%, rgba(14, 165, 233, 0.12), transparent 25%),
                        #0b1224;
            color: #0f172a;
        }

        #search-panel {
            padding: 18px 24px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.22);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .title-block {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-right: 16px;
        }

        .badge {
            padding: 6px 10px;
            border-radius: 12px;
            background: rgba(37, 99, 235, 0.1);
            color: var(--accent);
            font-weight: 700;
            font-size: 0.9em;
            letter-spacing: 0.5px;
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
            color: #0f172a;
        }

        .search-container {
            display: flex;
            gap: 10px;
            align-items: center;
            flex: 1;
            min-width: 280px;
        }

        #search-input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
            box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04);
        }

        .btn {
            padding: 12px 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.28);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(37, 99, 235, 0.35); }
        .btn:active { transform: translateY(0); }

        #file-input { display: none; }

        #status-message {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #progress-container {
            position: relative;
            margin-top: 10px;
            height: 8px;
            background: rgba(226, 232, 240, 0.8);
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.08);
            display: none;
        }

        #progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-dark));
            transition: width 0.2s ease;
        }

        #map { height: 72vh; width: 100%; border-top: 1px solid rgba(255, 255, 255, 0.4); }

        #details-panel {
            padding: 16px 20px 22px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 -10px 24px rgba(15, 23, 42, 0.2);
        }

        #details-panel h3 {
            margin: 0 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #0f172a;
        }

        #details-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px 16px;
        }

        .detail-item {
            background: #fff;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
        }

        .detail-label {
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
            color: #0f172a;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 0.9em;
            width: 100%;
            margin-top: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 6px rgba(37, 99, 235, 0.15);
            display: inline-block;
        }
    </style>
</head>
<body>
    <div id="search-panel">
        <div class="toolbar">
            <div class="title-block">
                <div class="badge">Carte Bâtiments</div>
                <h1>Hauts-de-France &amp; Normandie</h1>
            </div>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Rechercher un bâtiment ou propriétaire...">
                <button class="btn" onclick="searchBuildings()">Rechercher</button>
                <input type="file" id="file-input" accept=".csv,.json,.xlsx,.xls" onchange="importData(event)">
                <button class="btn" onclick="document.getElementById('file-input').click()">Importer données</button>
            </div>
        </div>
        <div id="status-message"><span class="status-dot"></span><span id="status-text"></span></div>
        <div id="progress-container"><div id="progress-bar"></div></div>
    </div>
    <div id="map"></div>
    <div id="details-panel">
        <h3 id="details-title">📄 Fiche bâtiment</h3>
        <div id="details-content">Sélectionnez un bâtiment pour afficher ses informations.</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
        // Initialisation de la carte centrée sur les régions
        const map = L.map('map').setView([49.5, 2.8], 8);

        // Ajout de la couche de tuiles OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const clusterOptions = {
            chunkedLoading: true,
            chunkDelay: 35,
            chunkInterval: 150,
            maxClusterRadius: 55,
            spiderfyOnMaxZoom: true,
            removeOutsideVisibleBounds: true,
            chunkProgress: (processed, total) => {
                const percent = Math.min(100, Math.round((processed / total) * 100));
                setStatus(`Placement des marqueurs... ${processed}/${total} (${percent}%)`);
            }
        };

        // Stockage des données de bâtiments
        let buildingsData = [];
        let buildingIdCounter = 1;
        let markersLayer = L.markerClusterGroup(clusterOptions).addTo(map);
        const markerIndex = new Map();
        const statusTextEl = document.getElementById('status-text');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const STORAGE_KEY = 'carte-batiments-v1';

        function resetMarkersLayer() {
            map.removeLayer(markersLayer);
            markerIndex.clear();
            markersLayer = L.markerClusterGroup(clusterOptions).addTo(map);
        }

        function setStatus(message) {
            statusTextEl.textContent = message || 'Prêt à importer vos données.';
        }

        function setProgress(percent, active = true) {
            const clamped = Math.max(0, Math.min(100, Math.round(percent)));
            if (!active) {
                progressContainer.style.display = 'none';
                progressBar.style.width = '0%';
                return;
            }
            progressContainer.style.display = 'block';
            progressBar.style.width = `${clamped}%`;
        }

        // Fonction pour ajouter un marqueur
        function addMarker(building) {
            const marker = L.marker([building.lat, building.lng], { title: building.nom })
                .bindPopup(`
                    <strong>${building.nom}</strong><br>
                    Propriétaire: ${building.proprietaire || '—'}<br>
                    Adresse: ${building.adresse || '—'}<br>
                    Type: ${building.type || 'Non spécifié'}<br>
                    <button class="btn btn-small" onclick="showBuildingDetails(${building.id})">Fiche du bâtiment</button>
                `);
            markersLayer.addLayer(marker);
            markerIndex.set(building.id, marker);
            return marker;
        }

        function persistBuildings() {
            try {
                const payload = {
                    buildings: buildingsData,
                    nextId: buildingIdCounter
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            } catch (e) {
                console.warn('Impossible de sauvegarder localement', e);
            }
        }

        function loadPersistedBuildings() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return false;
                const saved = JSON.parse(raw);
                if (!saved || !Array.isArray(saved.buildings) || saved.buildings.length === 0) return false;

                buildingIdCounter = saved.nextId || (Math.max(...saved.buildings.map(b => b.id || 0)) + 1);
                buildingsData = saved.buildings;
                resetMarkersLayer();
                setStatus(`Restauration de ${buildingsData.length} bâtiments sauvegardés...`);
                setProgress(10, true);
                placeMarkersInChunks(buildingsData, () => {
                    setStatus('Bâtiments restaurés depuis l\'autosauvegarde.');
                    setProgress(100);
                    setTimeout(() => setProgress(0, false), 600);
                });
                return true;
            } catch (e) {
                console.warn('Aucune autosauvegarde valide détectée', e);
                return false;
            }
        }

        // Fonction de recherche
        function searchBuildings() {
            const query = document.getElementById('search-input').value.toLowerCase();
            if (!query) {
                setStatus('Affichage de tous les bâtiments.');
                if (markersLayer.getLayers().length > 0) {
                    map.fitBounds(L.featureGroup(markersLayer.getLayers()).getBounds());
                }
                return;
            }

            const filteredBuildings = buildingsData.filter(building =>
                building.nom.toLowerCase().includes(query) ||
                building.proprietaire.toLowerCase().includes(query) ||
                building.adresse.toLowerCase().includes(query)
            );

            if (filteredBuildings.length === 0) {
                setStatus('Aucun bâtiment trouvé.');
                return;
            }

            const markers = filteredBuildings
                .map(building => markerIndex.get(building.id))
                .filter(Boolean);

            if (markers.length === 0) return;

            const group = new L.featureGroup(markers);
            map.fitBounds(group.getBounds());

            const first = markers[0];
            markersLayer.zoomToShowLayer(first, () => first.openPopup());
        }

        // Fonction d'import de données
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const extension = file.name.split('.').pop().toLowerCase();
            const reader = new FileReader();

            setStatus('Lecture du fichier en cours...');
            setProgress(5, true);

            reader.onload = function(e) {
                try {
                    if (extension === 'json') {
                        const data = JSON.parse(e.target.result);
                        processImportedData(data);
                    } else if (extension === 'csv') {
                        const csv = e.target.result;
                        const data = parseCSV(csv);
                        processImportedData(data);
                    } else if (extension === 'xlsx' || extension === 'xls') {
                        const data = parseExcel(e.target.result);
                        processImportedData(data);
                    } else {
                        alert('Format non supporté. Veuillez importer un CSV, JSON ou Excel.');
                        setProgress(0, false);
                    }
                } catch (error) {
                    setStatus('Erreur lors de l\'import.');
                    setProgress(0, false);
                    alert('Erreur lors de l\'import: ' + error.message);
                }
            };

            if (extension === 'xlsx' || extension === 'xls') {
                reader.readAsArrayBuffer(file);
            } else {
                reader.readAsText(file);
            }

            event.target.value = '';
        }

        // Normalisation d'un bâtiment : repère les coordonnées même si les champs sont nommés différemment
        function normalizeBuilding(item) {
            const lat = findCoordinate(item, ['lat', 'latitude', 'y', 'coordy']);
            const lng = findCoordinate(item, ['lng', 'lon', 'longitude', 'x', 'coordx']);

            let normalizedLat = lat;
            let normalizedLng = lng;

            // Si aucune correspondance explicite, on tente de récupérer les deux dernières valeurs numériques
            if (normalizedLat === null || normalizedLng === null) {
                const numericValues = Object.values(item)
                    .map(parseNumericValue)
                    .filter(value => value !== null);

                if (numericValues.length >= 2) {
                    normalizedLat = numericValues[numericValues.length - 1];
                    normalizedLng = numericValues[numericValues.length - 2];
                }
            }

            if (normalizedLat === null || normalizedLng === null) {
                return null;
            }

            const baseName = item.nom || item.name || item.Nom || item.libelle || item.label;
            const baseOwner = item.proprietaire || item.owner || item.Proprietaire || item.gestionnaire;
            const baseAddress = item.adresse || item.address || item.Adresse || item.localisation;
            const baseType = item.type || item.categorie || item.Type || item.catégorie;

            const building = {
                id: buildingIdCounter++,
                nom: (baseName && String(baseName).trim()) || `Bâtiment ${buildingIdCounter - 1}`,
                proprietaire: baseOwner ? String(baseOwner).trim() : '',
                adresse: baseAddress ? String(baseAddress).trim() : '',
                type: baseType ? String(baseType).trim() : '',
                lat: normalizedLat,
                lng: normalizedLng,
                details: {},
            };

            Object.keys(item).forEach(key => {
                const value = item[key];
                building.details[key] = value === undefined || value === null ? '' : value;
            });

            building.details.latitude = normalizedLat;
            building.details.longitude = normalizedLng;

            return building;
        }

        // Récupère une coordonnée à partir d'une liste de clés potentielles
        function findCoordinate(item, possibleKeys) {
            for (const key of possibleKeys) {
                const matchingKey = Object.keys(item).find(
                    k => k.toLowerCase() === key.toLowerCase()
                );

                if (matchingKey) {
                    const value = parseNumericValue(item[matchingKey]);
                    if (value !== null) return value;
                }
            }
            return null;
        }

        // Conversion d'une valeur en nombre en gérant les virgules décimales
        function parseNumericValue(value) {
            if (value === undefined || value === null) return null;
            const normalized = String(value).replace(',', '.');
            const number = parseFloat(normalized);
            return Number.isNaN(number) ? null : number;
        }

        // Traitement des données importées (asynchrone pour éviter les blocages)
        function processImportedData(data) {
            const rows = Array.isArray(data) ? data : Object.values(data || {});
            if (!rows || rows.length === 0) {
                setStatus('Aucune donnée détectée.');
                setProgress(0, false);
                return;
            }

            setStatus('Normalisation des lignes en cours...');
            setProgress(12, true);
            buildingIdCounter = 1;
            resetMarkersLayer();
            buildingsData = [];

            const chunkSize = 350;
            let index = 0;

            function normalizeChunk() {
                const end = Math.min(index + chunkSize, rows.length);
                for (let i = index; i < end; i++) {
                    const normalized = normalizeBuilding(rows[i]);
                    if (normalized) {
                        buildingsData.push(normalized);
                    }
                }
                index = end;

                if (index < rows.length) {
                    const percent = 12 + Math.round((index / rows.length) * 40);
                    setStatus(`Normalisation... ${index}/${rows.length}`);
                    setProgress(percent, true);
                    setTimeout(normalizeChunk, 0);
                } else {
                    setStatus(`Placement des marqueurs (${buildingsData.length} bâtiments)...`);
                    setProgress(55, true);
                    placeMarkersInChunks(buildingsData, () => {
                        persistBuildings();
                        alert(`${buildingsData.length} bâtiments importés avec succès!`);
                        setStatus('Import terminé.');
                        setProgress(100, true);
                        setTimeout(() => setProgress(0, false), 800);
                    });
                }
            }

            normalizeChunk();
        }

        function placeMarkersInChunks(items, onDone) {
            const chunkSize = 800;
            let index = 0;

            function addChunk() {
                const batch = [];
                const end = Math.min(index + chunkSize, items.length);
                for (let i = index; i < end; i++) {
                    batch.push(addMarker(items[i]));
                }
                index = end;

                if (index < items.length) {
                    setStatus(`Préparation des marqueurs... ${index}/${items.length}`);
                    const percent = 55 + Math.round((index / items.length) * 40);
                    setProgress(percent, true);
                    (window.requestIdleCallback || window.setTimeout)(addChunk, 0);
                } else {
                    const layers = markersLayer.getLayers();
                    if (layers.length > 0) {
                        const group = new L.featureGroup(layers);
                        map.fitBounds(group.getBounds());
                    }
                    setProgress(95, true);
                    if (onDone) onDone();
                }
            }

            addChunk();
        }

        function showBuildingDetails(buildingId) {
            const building = buildingsData.find(b => b.id === buildingId);
            if (!building) return;

            const title = document.getElementById('details-title');
            const content = document.getElementById('details-content');
            title.textContent = building.nom;

            const entries = Object.entries(building.details)
                .map(([key, value]) => ({ key, value }));

            if (entries.length === 0) {
                content.textContent = 'Aucune information disponible pour ce bâtiment.';
                return;
            }

            content.innerHTML = entries
                .map(entry => `
                    <div class="detail-item">
                        <span class="detail-label">${entry.key}</span>
                        <span>${entry.value}</span>
                    </div>
                `)
                .join('');
        }

        // Détection du séparateur utilisé dans le fichier
        function detectDelimiter(line) {
            if (line.includes(';')) return ';';
            if (line.includes('\t')) return '\t';
            if (line.includes('|')) return '|';
            return ',';
        }

        // Parser CSV amélioré : accepte ;, tabulations ou virgules et les décimales françaises
        function parseCSV(csv) {
            const lines = csv.split(/\r?\n/).filter(line => line.trim());
            if (lines.length === 0) return [];

            const delimiter = detectDelimiter(lines[0]);
            const headers = lines[0]
                .split(delimiter)
                .map(h => h.replace(/\uFEFF/g, '').trim());
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(delimiter).map(v => v.trim());
                const item = {};
                headers.forEach((header, index) => {
                    const value = values[index] || '';
                    const numericValue = parseNumericValue(value);
                    item[header] = numericValue !== null ? numericValue : value;
                });
                data.push(item);
            }
            return data;
        }

        // Lecture de la première feuille Excel et conversion en objets
        function parseExcel(arrayBuffer) {
            const workbook = XLSX.read(arrayBuffer, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[firstSheetName];
            return XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
        }

        // Données d'exemple
        const exempleData = [
            {
                nom: "Mairie de Lille",
                proprietaire: "Ville de Lille",
                adresse: "Place Augustin Laurent, Lille",
                lat: 50.6292,
                lng: 3.0573,
                type: "Bâtiment public"
            },
            {
                nom: "Cathédrale de Rouen",
                proprietaire: "État français",
                adresse: "Place de la Cathédrale, Rouen",
                lat: 49.4404,
                lng: 1.0940,
                type: "Monument historique"
            }
        ].map((building) => ({
            ...building,
            id: buildingIdCounter++,
            details: {
                ...building,
                latitude: building.lat,
                longitude: building.lng
            }
        }));

        const restored = loadPersistedBuildings();
        if (!restored) {
            buildingsData = exempleData;
            resetMarkersLayer();
            placeMarkersInChunks(buildingsData, () => {
                setStatus('Prêt à importer vos données.');
                setProgress(0, false);
            });
        }
    </script>
</body>
</html>
