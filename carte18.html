<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Carte interactive des bâtiments (gros volume)</title>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
  />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- MarkerCluster CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
  />

  <!-- PapaParse (CSV) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- SheetJS (Excel) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      color: #0f172a;
    }

    header {
      padding: 14px 18px;
      background: linear-gradient(90deg, #0f172a, #1e293b);
      color: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
    }

    header h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    header .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    main {
      flex: 1;
      display: flex;
      gap: 12px;
      padding: 12px;
      overflow: hidden;
    }

    #map {
      flex: 2;
      min-width: 0;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      border: 1px solid #e2e8f0;
    }

    #sidebar {
      flex: 1;
      min-width: 340px;
      max-width: 460px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }

    #sidebar-section {
      padding: 16px;
      border-bottom: 1px solid #e2e8f0;
      background: #f8fafc;
    }

    #sidebar-section h2 {
      font-size: 16px;
      margin-bottom: 12px;
      font-weight: 700;
      color: #0f172a;
    }

    .field-group {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    input[type="file"],
    input[type="text"],
    select,
    button {
      font-size: 13px;
    }

    input[type="text"],
    select,
    input[type="file"] {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #0f172a;
    }

    button {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #0ea5e9;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: #f8fafc;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
      font-weight: 600;
    }

    button.secondary {
      background: #f1f5f9;
      color: #0f172a;
      border-color: #cbd5e1;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(14, 165, 233, 0.25);
      filter: brightness(1.02);
    }
    button.secondary:hover {
      box-shadow: 0 6px 12px rgba(148, 163, 184, 0.25);
    }

    #messages {
      font-size: 12px;
      color: #0ea5e9;
      margin-top: 4px;
      min-height: 16px;
    }

    #filters {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    #results-info {
      font-size: 12px;
      color: #475569;
      margin-top: 6px;
    }

    #building-details {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #ffffff;
    }

    #building-details h3 {
      font-size: 16px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #building-details p,
    .detail-value {
      font-size: 13px;
      margin-bottom: 4px;
    }

    #building-details .empty {
      font-size: 13px;
      color: #94a3b8;
      font-style: italic;
    }

    #building-list {
      max-height: 180px;
      overflow-y: auto;
      margin-top: 10px;
      border-top: 1px solid #e2e8f0;
      padding-top: 8px;
      font-size: 12px;
      display: grid;
      gap: 6px;
    }

    .building-item {
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      transition: all 0.12s ease;
    }

    .building-item:hover {
      background: #e0f2fe;
      border-color: #bae6fd;
      color: #0f172a;
    }

    .building-item.selected {
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: #f8fafc;
      border-color: transparent;
      box-shadow: 0 10px 24px rgba(14, 165, 233, 0.35);
    }

    #no-results {
      font-size: 12px;
      color: #b91c1c;
      margin-top: 4px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 600;
      font-size: 12px;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .detail-card {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px;
      background: #f8fafc;
    }

    .detail-label {
      font-size: 12px;
      font-weight: 700;
      color: #475569;
    }

    .detail-value {
      margin-top: 4px;
      color: #0f172a;
      word-break: break-word;
    }

    #detail-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      backdrop-filter: blur(4px);
      padding: 24px;
    }

    #detail-modal.open { display: flex; }

    .detail-modal-card {
      background: #ffffff;
      border-radius: 16px;
      width: min(900px, 90vw);
      max-height: 80vh;
      overflow: hidden;
      box-shadow: 0 24px 50px rgba(15, 23, 42, 0.35);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
    }

    .detail-modal-header {
      padding: 16px 20px;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-modal-body {
      padding: 18px;
      overflow-y: auto;
    }

    .close-modal {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #f8fafc;
    }

    .leaflet-container { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>Carte interactive des bâtiments (50 000+)</h1>
    <div class="controls">
      <button id="basemap-toggle" class="secondary">Mode carte : réaliste</button>
      <button id="reset-state" class="secondary">Réinitialiser les filtres</button>
    </div>
  </header>

  <main>
    <div id="map"></div>

    <aside id="sidebar">
      <div id="sidebar-section">
        <h2>Données & recherche</h2>

        <div class="field-group">
          <label for="file-input">Importer un CSV ou Excel (.xlsx/.xls)</label>
          <input id="file-input" type="file" accept=".csv,.xls,.xlsx" />
          <div id="messages"></div>
        </div>

        <div class="field-group">
          <label for="search-input">Recherche globale</label>
          <input id="search-input" type="text" placeholder="Nom, adresse, ville, type..." />
        </div>

        <div id="filters"></div>

        <div id="results-info"></div>
        <div id="no-results" style="display:none;">Aucun bâtiment trouvé.</div>

        <button id="fit-all" style="margin-top:8px;">Voir tous les bâtiments visibles</button>

        <div id="building-list"></div>
      </div>

      <div id="building-details">
        <p class="empty">
          Sélectionnez un bâtiment sur la carte pour afficher ses détails.
        </p>
      </div>
    </aside>
  </main>

  <div id="detail-modal" aria-hidden="true">
    <div class="detail-modal-card">
      <div class="detail-modal-header">
        <div>
          <div id="modal-pill-row" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
          <h3 id="modal-title" style="margin-top:6px; font-size:18px;"></h3>
        </div>
        <button class="close-modal" id="close-modal">Fermer</button>
      </div>
      <div class="detail-modal-body">
        <div id="modal-details"></div>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    // ---- CONSTANTES ----
    const STORAGE_KEY = 'batimentsAppState_v3';
    const DB_NAME = 'BatimentsDataDB';
    const DB_STORE = 'datasets';
    const DB_VERSION = 1;
    const PREFERRED_FILTER_FIELDS = ['Type', 'type', 'Categorie', 'Catégorie'];
    const ADVANCED_FILTER_FIELDS = [
      { id: 'propriobati', label: 'Propriétaire (propriobati)' },
      { id: 'situgene', label: 'Situation (situgene)' },
      { id: 'portefeuille', label: 'Portefeuille' },
      { id: 'NUMEROSNCF', label: 'Numéro SNCF' },
      { id: 'UTO_CODE', label: 'Code UTO' }
    ];
    const MAX_LIST_ITEMS = 200; // max dans la liste à droite pour éviter de tuer le DOM
    let searchDebounce = null;

    // ---- ÉTAT GLOBAL ----
    let map;
    let baseLayers = {};
    let currentBase = 'realistic';

    let clusterGroup;
    let allBuildings = [];
    let filteredBuildings = [];

    let activeFilterField = null;
    let activeFilterValue = 'ALL';
    let advancedFilterKeyMap = {};
    let advancedFiltersById = {};
    let searchText = '';
    let selectedBuildingIndex = null;

    let dbPromise = null;

    // ---- UTIL ----
    function showMessage(text, isError = false) {
      const el = document.getElementById('messages');
      el.textContent = text || '';
      el.style.color = isError ? '#b91c1c' : '#6b7280';
    }

    function saveStateToLocalStorage() {
      try {
        const mapCenter = map ? map.getCenter() : null;
        const mapZoom = map ? map.getZoom() : null;

        const state = {
          // IMPORTANT : on NE stocke PAS les 50 000 lignes
          activeFilterField,
          activeFilterValue,
          advancedFiltersById,
          searchText,
          selectedBuildingIndex,
          currentBase,
          mapCenter: mapCenter ? { lat: mapCenter.lat, lng: mapCenter.lng } : null,
          mapZoom
        };

        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Erreur sauvegarde localStorage', e);
      }
    }

    function loadStateFromLocalStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) {
        console.error('Erreur lecture localStorage', e);
        return null;
      }
    }

    function clearSavedState() {
      localStorage.removeItem(STORAGE_KEY);
    }

    // ---- PERSISTANCE INDEXEDDB ----
    function getDb() {
      if (dbPromise) return dbPromise;

      dbPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onerror = (event) => {
          console.error('IndexedDB error', event);
          reject(event);
        };

        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(DB_STORE)) {
            db.createObjectStore(DB_STORE);
          }
        };

        request.onsuccess = (event) => {
          resolve(event.target.result);
        };
      });

      return dbPromise;
    }

    function saveDatasetToIndexedDB(rows) {
      return getDb().then((db) => {
        return new Promise((resolve, reject) => {
          const tx = db.transaction([DB_STORE], 'readwrite');
          const store = tx.objectStore(DB_STORE);
          const payload = { rows, savedAt: Date.now() };
          const req = store.put(payload, 'latest');

          req.onsuccess = () => resolve(true);
          req.onerror = (event) => {
            console.error('Erreur sauvegarde IndexedDB', event);
            reject(event);
          };
        });
      }).catch((err) => {
        console.error('IndexedDB indisponible', err);
      });
    }

    function loadDatasetFromIndexedDB() {
      return getDb().then((db) => {
        return new Promise((resolve, reject) => {
          const tx = db.transaction([DB_STORE], 'readonly');
          const store = tx.objectStore(DB_STORE);
          const req = store.get('latest');

          req.onsuccess = (event) => {
            resolve(event.target.result || null);
          };
          req.onerror = (event) => {
            console.error('Erreur lecture IndexedDB', event);
            reject(event);
          };
        });
      }).catch((err) => {
        console.error('IndexedDB indisponible', err);
        return null;
      });
    }

    function clearDatasetFromIndexedDB() {
      return getDb().then((db) => {
        return new Promise((resolve, reject) => {
          const tx = db.transaction([DB_STORE], 'readwrite');
          const store = tx.objectStore(DB_STORE);
          const req = store.delete('latest');

          req.onsuccess = () => resolve(true);
          req.onerror = (event) => {
            console.error('Erreur suppression IndexedDB', event);
            reject(event);
          };
        });
      }).catch((err) => {
        console.error('IndexedDB indisponible', err);
      });
    }

    // ---- CARTE ----
    function initMap() {
      map = L.map('map', {
        center: [46.8, 2.5],
        zoom: 6,
        preferCanvas: true
      });

      const realistic = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      });

      const schematic = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap, style HOT'
      });

      baseLayers = { realistic, schematic };
      realistic.addTo(map);

      clusterGroup = L.markerClusterGroup();
      map.addLayer(clusterGroup);
    }

    function setBaseLayer(mode) {
      if (!map) return;
      Object.values(baseLayers).forEach(layer => {
        if (map.hasLayer(layer)) map.removeLayer(layer);
      });

      if (mode === 'schematic') {
        baseLayers.schematic.addTo(map);
      } else {
        baseLayers.realistic.addTo(map);
      }

      currentBase = mode;
      const btn = document.getElementById('basemap-toggle');
      btn.textContent = mode === 'schematic'
        ? 'Mode carte : schématique'
        : 'Mode carte : réaliste';

      saveStateToLocalStorage();
    }

    // ---- DONNÉES / EXCEL / CSV ----
    function guessFilterFieldFromBuildings(buildings) {
      if (!buildings || !buildings.length) return null;
      const sample = buildings[0];
      const keys = Object.keys(sample);
      const candidates = keys.filter(k => !['Lat','Lon','lat','lon','latitude','longitude'].includes(k));

      for (const preferred of PREFERRED_FILTER_FIELDS) {
        if (candidates.includes(preferred)) return preferred;
      }
      for (const key of candidates) {
        if (typeof sample[key] === 'string') return key;
      }
      return null;
    }

    function handleRowsData(data) {
      if (!data.length) {
        showMessage('Le fichier est vide ou incorrect.', true);
        return;
      }

      const firstRow = data[0];
      const hasLon = 'Lon' in firstRow || 'lon' in firstRow;
      const hasLat = 'Lat' in firstRow || 'lat' in firstRow;
      if (!hasLon || !hasLat) {
        showMessage('Le fichier doit contenir des colonnes "Lon" et "Lat".', true);
        return;
      }

      const buildings = [];
      data.forEach((row) => {
        const lon = parseFloat(row.Lon ?? row.lon);
        const lat = parseFloat(row.Lat ?? row.lat);
        if (isNaN(lon) || isNaN(lat)) return;
        const building = { ...row, Lon: lon, Lat: lat };
        buildings.push(building);
      });

      if (!buildings.length) {
        showMessage('Aucune ligne valide avec Lon/Lat.', true);
        return;
      }

      allBuildings = buildings;
      activeFilterField = guessFilterFieldFromBuildings(allBuildings);
      activeFilterValue = 'ALL';
      advancedFilterKeyMap = computeAdvancedFilterKeyMap(allBuildings[0]);
      resetAdvancedFilters();
      searchText = '';
      selectedBuildingIndex = null;

      rebuildFiltersUI();
      applyFiltersAndSearch();

      showMessage('Données chargées : ' + allBuildings.length + ' bâtiments.', false);
      saveStateToLocalStorage();
      saveDatasetToIndexedDB(allBuildings);
    }

    function handleCsvData(results) {
      const data = results.data || [];
      handleRowsData(data);
    }

    function loadCsvFromFile(file) {
      if (!file) return;
      showMessage('Chargement du fichier CSV...', false);

      Papa.parse(file, {
        header: true,
        dynamicTyping: false,
        skipEmptyLines: true,
        complete: (results) => handleCsvData(results),
        error: (error) => {
          console.error(error);
          showMessage('Erreur lecture CSV.', true);
        }
      });
    }

    function loadExcelFile(file) {
      if (!file) return;
      showMessage('Chargement du fichier Excel...', false);

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const sheet = workbook.Sheets[firstSheetName];
          const rows = XLSX.utils.sheet_to_json(sheet);
          handleRowsData(rows);
        } catch (err) {
          console.error(err);
          showMessage('Erreur lecture Excel.', true);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function computeAdvancedFilterKeyMap(sample) {
      const map = {};
      if (!sample) return map;
      const lowerKeyMap = {};
      Object.keys(sample).forEach((key) => {
        lowerKeyMap[key.toLowerCase()] = key;
      });
      ADVANCED_FILTER_FIELDS.forEach(({ id }) => {
        const match = lowerKeyMap[id.toLowerCase()];
        if (match) map[id] = match;
      });
      return map;
    }

    function resetAdvancedFilters(savedFilters = null) {
      advancedFiltersById = {};
      ADVANCED_FILTER_FIELDS.forEach(({ id }) => {
        const value = savedFilters && savedFilters[id] ? savedFilters[id] : 'ALL';
        advancedFiltersById[id] = value;
      });
    }

    // ---- FILTRES & RECHERCHE ----
    function applyFiltersAndSearch() {
      if (!allBuildings.length) {
        filteredBuildings = [];
        updateMapMarkers();
        updateResultsInfo();
        updateBuildingList();
        updateNoResults();
        return;
      }

      const text = (searchText || '').trim().toLowerCase();
      filteredBuildings = allBuildings.filter((b) => {
        if (activeFilterField && activeFilterValue && activeFilterValue !== 'ALL') {
          if (String(b[activeFilterField]) !== activeFilterValue) return false;
        }

        for (const { id } of ADVANCED_FILTER_FIELDS) {
          const key = advancedFilterKeyMap[id];
          const selected = advancedFiltersById[id];
          if (key && selected && selected !== 'ALL') {
            if (String(b[key]) !== selected) return false;
          }
        }

        if (text.length > 0) {
          let found = false;
          for (const [key, value] of Object.entries(b)) {
            if (['Lon','Lat','lon','lat'].includes(key)) continue;
            if (value == null) continue;
            const s = String(value).toLowerCase();
            if (s.includes(text)) { found = true; break; }
          }
          if (!found) return false;
        }

        return true;
      });

      updateMapMarkers();
      updateResultsInfo();
      updateBuildingList();
      updateNoResults();
      saveStateToLocalStorage();
    }

    function rebuildFiltersUI() {
      const filtersDiv = document.getElementById('filters');
      filtersDiv.innerHTML = '';

      if (!allBuildings.length) return;

      if (activeFilterField) {
        const label = document.createElement('label');
        label.textContent = 'Filtrer par "' + activeFilterField + '"';

        const select = document.createElement('select');
        select.id = 'filter-select';

        const optAll = document.createElement('option');
        optAll.value = 'ALL';
        optAll.textContent = 'Tous';
        select.appendChild(optAll);

        const valuesSet = new Set();
        allBuildings.forEach((b) => {
          const val = b[activeFilterField];
          if (val != null && val !== '') valuesSet.add(String(val));
        });

        Array.from(valuesSet).sort().forEach((val) => {
          const opt = document.createElement('option');
          opt.value = val;
          opt.textContent = val;
          select.appendChild(opt);
        });

        select.value = activeFilterValue || 'ALL';

        select.addEventListener('change', () => {
          activeFilterValue = select.value;
          applyFiltersAndSearch();
        });

        const container = document.createElement('div');
        container.className = 'field-group';
        container.appendChild(label);
        container.appendChild(select);
        filtersDiv.appendChild(container);
      }

      const availableAdvanced = ADVANCED_FILTER_FIELDS.filter(({ id }) => advancedFilterKeyMap[id]);
      if (!availableAdvanced.length) return;

      const sectionTitle = document.createElement('h3');
      sectionTitle.style.fontSize = '13px';
      sectionTitle.style.margin = '6px 0 2px 0';
      sectionTitle.style.color = '#0f172a';
      sectionTitle.textContent = 'Filtres avancés';
      filtersDiv.appendChild(sectionTitle);

      availableAdvanced.forEach(({ id, label }) => {
        const actualKey = advancedFilterKeyMap[id];
        const select = document.createElement('select');

        const optAll = document.createElement('option');
        optAll.value = 'ALL';
        optAll.textContent = 'Tous';
        select.appendChild(optAll);

        const valuesSet = new Set();
        allBuildings.forEach((b) => {
          const val = b[actualKey];
          if (val != null && val !== '') valuesSet.add(String(val));
        });

        Array.from(valuesSet).sort().forEach((val) => {
          const opt = document.createElement('option');
          opt.value = val;
          opt.textContent = val;
          select.appendChild(opt);
        });

        select.value = advancedFiltersById[id] || 'ALL';

        select.addEventListener('change', () => {
          advancedFiltersById[id] = select.value;
          applyFiltersAndSearch();
        });

        const container = document.createElement('div');
        container.className = 'field-group';
        const fieldLabel = document.createElement('label');
        fieldLabel.textContent = label;
        container.appendChild(fieldLabel);
        container.appendChild(select);
        filtersDiv.appendChild(container);
      });
    }

    function updateResultsInfo() {
      const el = document.getElementById('results-info');
      if (!filteredBuildings.length) { el.textContent = ''; return; }
      el.textContent = filteredBuildings.length + ' bâtiment(s) correspondant(s).';
    }

    function updateNoResults() {
      const el = document.getElementById('no-results');
      if (!allBuildings.length) { el.style.display = 'none'; return; }
      el.style.display = filteredBuildings.length ? 'none' : 'block';
    }

    // ---- MARQUEURS & CLUSTER ----
    function updateMapMarkers() {
      clusterGroup.clearLayers();

      if (!map || !filteredBuildings.length) return;

      const bounds = [];
      filteredBuildings.forEach((b, index) => {
        const lat = b.Lat ?? b.lat;
        const lon = b.Lon ?? b.lon;
        if (typeof lat !== 'number' || typeof lon !== 'number') return;

        const marker = L.marker([lat, lon]);
        marker.on('click', () => {
          const globalIndex = allBuildings.indexOf(b);
          if (globalIndex !== -1) selectBuilding(globalIndex, true, true);
        });

        clusterGroup.addLayer(marker);
        bounds.push([lat, lon]);
      });

      if (bounds.length) {
        const group = L.featureGroup(
          bounds.map(([la, lo]) => L.marker([la, lo]))
        );
        map.fitBounds(group.getBounds(), { padding: [20, 20] });
      }
    }

    function fitAllVisible() {
      if (!map || !clusterGroup.getLayers().length) return;
      const bounds = clusterGroup.getBounds();
      map.fitBounds(bounds, { padding: [20, 20] });
    }

    // ---- LISTE & DÉTAILS ----
    function buildBuildingLabel(b) {
      const parts = [];
      if (b.Nom || b.nom || b["NomBatiment"]) {
        parts.push(b.Nom || b.nom || b["NomBatiment"]);
      }
      if (b.Adresse || b.adresse) parts.push(b.Adresse || b.adresse);
      if (b.Ville || b.ville) parts.push(b.Ville || b.ville);
      if (activeFilterField && b[activeFilterField]) {
        parts.push('(' + String(b[activeFilterField]) + ')');
      }
      return parts.length ? parts.join(' - ') : 'Bâtiment';
    }

    function updateBuildingList() {
      const listDiv = document.getElementById('building-list');
      listDiv.innerHTML = '';

      if (!filteredBuildings.length) return;

      const total = filteredBuildings.length;
      const count = Math.min(total, MAX_LIST_ITEMS);

      if (total > MAX_LIST_ITEMS) {
        const info = document.createElement('div');
        info.style.fontSize = '11px';
        info.style.color = '#6b7280';
        info.textContent = `Affichage des ${count} premiers résultats sur ${total}. Utilisez la recherche / les filtres pour affiner.`;
        listDiv.appendChild(info);
      }

      const slice = filteredBuildings.slice(0, count);
      slice.forEach((b) => {
        const globalIndex = allBuildings.indexOf(b);
        const item = document.createElement('div');
        item.className = 'building-item';
        item.textContent = buildBuildingLabel(b);

        if (selectedBuildingIndex === globalIndex) {
          item.classList.add('selected');
        }

        item.addEventListener('click', () => {
          selectBuilding(globalIndex, true, true);
        });

        listDiv.appendChild(item);
      });
    }

    function selectBuilding(globalIndex, centerOnMap = false, showSheet = false) {
      if (
        globalIndex == null ||
        globalIndex < 0 ||
        globalIndex >= allBuildings.length
      ) {
        selectedBuildingIndex = null;
      } else {
        selectedBuildingIndex = globalIndex;
      }

      updateBuildingDetails();
      updateBuildingList();
      saveStateToLocalStorage();

      if (centerOnMap && selectedBuildingIndex != null) {
        const b = allBuildings[selectedBuildingIndex];
        const lat = b.Lat ?? b.lat;
        const lon = b.Lon ?? b.lon;
        if (!isNaN(lat) && !isNaN(lon) && map) {
          map.setView([lat, lon], Math.max(map.getZoom(), 16));
        }
      }

      if (showSheet && selectedBuildingIndex != null) {
        openDetailModal(allBuildings[selectedBuildingIndex]);
      }
    }

    function renderBuildingFields(b, container) {
      const grid = document.createElement('div');
      grid.className = 'details-grid';

      Object.keys(b).forEach((key) => {
        const value = b[key];
        const card = document.createElement('div');
        card.className = 'detail-card';

        const label = document.createElement('div');
        label.className = 'detail-label';
        label.textContent = key;

        const val = document.createElement('div');
        val.className = 'detail-value';
        val.textContent = value == null ? '' : value;

        card.appendChild(label);
        card.appendChild(val);
        grid.appendChild(card);
      });

      container.appendChild(grid);
    }

    function updateBuildingDetails() {
      const container = document.getElementById('building-details');
      container.innerHTML = '';

      if (
        selectedBuildingIndex == null ||
        selectedBuildingIndex < 0 ||
        selectedBuildingIndex >= allBuildings.length
      ) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'Sélectionnez un bâtiment sur la carte pour afficher ses détails.';
        container.appendChild(p);
        return;
      }

      const b = allBuildings[selectedBuildingIndex];

      const header = document.createElement('div');
      header.style.display = 'flex';
      header.style.flexDirection = 'column';
      header.style.gap = '6px';

      const title = document.createElement('h3');
      title.textContent = buildBuildingLabel(b);
      header.appendChild(title);

      const pillRow = document.createElement('div');
      pillRow.style.display = 'flex';
      pillRow.style.flexWrap = 'wrap';
      pillRow.style.gap = '6px';

      if (activeFilterField && b[activeFilterField]) {
        const pill = document.createElement('span');
        pill.className = 'pill';
        pill.textContent = `${activeFilterField}: ${b[activeFilterField]}`;
        pillRow.appendChild(pill);
      }

      ADVANCED_FILTER_FIELDS.forEach(({ id, label }) => {
        const key = advancedFilterKeyMap[id];
        const selected = advancedFiltersById[id];
        if (key && selected && selected !== 'ALL' && b[key]) {
          const pill = document.createElement('span');
          pill.className = 'pill';
          pill.textContent = `${label}: ${b[key]}`;
          pillRow.appendChild(pill);
        }
      });

      if (pillRow.children.length) header.appendChild(pillRow);

      container.appendChild(header);
      renderBuildingFields(b, container);
    }

    function openDetailModal(building) {
      const modal = document.getElementById('detail-modal');
      const titleEl = document.getElementById('modal-title');
      const detailsEl = document.getElementById('modal-details');
      const pillRowEl = document.getElementById('modal-pill-row');

      titleEl.textContent = buildBuildingLabel(building);
      detailsEl.innerHTML = '';
      renderBuildingFields(building, detailsEl);

      pillRowEl.innerHTML = '';

      if (activeFilterField && building[activeFilterField]) {
        const pill = document.createElement('span');
        pill.className = 'pill';
        pill.textContent = `${activeFilterField}: ${building[activeFilterField]}`;
        pillRowEl.appendChild(pill);
      }

      ADVANCED_FILTER_FIELDS.forEach(({ id, label }) => {
        const key = advancedFilterKeyMap[id];
        const selected = advancedFiltersById[id];
        if (key && selected && selected !== 'ALL' && building[key]) {
          const pill = document.createElement('span');
          pill.className = 'pill';
          pill.textContent = `${label}: ${building[key]}`;
          pillRowEl.appendChild(pill);
        }
      });

      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }

    function closeDetailModal() {
      const modal = document.getElementById('detail-modal');
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
    }

    // ---- RESET / RESTORE ----
    function resetFiltersAndSearch() {
      activeFilterValue = 'ALL';
      resetAdvancedFilters();
      searchText = '';
      selectedBuildingIndex = null;

      document.getElementById('search-input').value = '';
      rebuildFiltersUI();
      applyFiltersAndSearch();
      updateBuildingDetails();
      showMessage('Filtres et recherche réinitialisés.', false);
      clearSavedState();
    }

    function restoreFromSavedState(saved) {
      activeFilterField = saved.activeFilterField || activeFilterField;
      activeFilterValue = saved.activeFilterValue || 'ALL';
      resetAdvancedFilters(saved.advancedFiltersById || null);
      searchText = saved.searchText || '';
      selectedBuildingIndex =
        saved.selectedBuildingIndex != null ? saved.selectedBuildingIndex : null;
      currentBase = saved.currentBase || 'realistic';

      document.getElementById('search-input').value = searchText;

      rebuildFiltersUI();
      applyFiltersAndSearch();

      if (saved.mapCenter && saved.mapZoom && map) {
        map.setView([saved.mapCenter.lat, saved.mapCenter.lng], saved.mapZoom);
      }

      if (selectedBuildingIndex != null) updateBuildingDetails();
      setBaseLayer(currentBase);
    }

    // ---- DOM READY ----
    document.addEventListener('DOMContentLoaded', () => {
      initMap();

      const saved = loadStateFromLocalStorage();
      if (saved) {
        // On ne peut restaurer complètement qu'après import,
        // donc là on restaure juste le mode de carte et on attend les données.
        currentBase = saved.currentBase || 'realistic';
        setBaseLayer(currentBase);
      }

      loadDatasetFromIndexedDB().then((payload) => {
        if (!payload || !payload.rows || !payload.rows.length) {
          showMessage('Importez un fichier CSV/Excel pour commencer.', false);
          return;
        }

        allBuildings = payload.rows;
        activeFilterField = (saved && saved.activeFilterField) || guessFilterFieldFromBuildings(allBuildings);
        activeFilterValue = (saved && saved.activeFilterValue) || 'ALL';
        advancedFilterKeyMap = computeAdvancedFilterKeyMap(allBuildings[0]);
        resetAdvancedFilters((saved && saved.advancedFiltersById) || null);
        searchText = (saved && saved.searchText) || '';
        selectedBuildingIndex = saved && saved.selectedBuildingIndex != null
          ? saved.selectedBuildingIndex
          : null;

        document.getElementById('search-input').value = searchText;

        rebuildFiltersUI();
        applyFiltersAndSearch();

        if (saved && saved.mapCenter && saved.mapZoom && map) {
          map.setView([saved.mapCenter.lat, saved.mapCenter.lng], saved.mapZoom);
        }

        if (selectedBuildingIndex != null) updateBuildingDetails();
        showMessage('Données restaurées automatiquement (' + allBuildings.length + ' bâtiments).', false);
      }).catch(() => {
        showMessage('Importez un fichier CSV/Excel pour commencer.', false);
      });

      const fileInput = document.getElementById('file-input');
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const name = file.name.toLowerCase();

        if (name.endsWith('.csv')) {
          loadCsvFromFile(file);
        } else if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
          loadExcelFile(file);
        } else {
          showMessage('Format non supporté. Utilisez CSV ou Excel.', true);
        }
      });

      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', (e) => {
        const value = e.target.value;
        if (searchDebounce) clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => {
          searchText = value;
          applyFiltersAndSearch();
        }, 300);
      });

      const toggleBtn = document.getElementById('basemap-toggle');
      toggleBtn.addEventListener('click', () => {
        const newMode = currentBase === 'realistic' ? 'schematic' : 'realistic';
        setBaseLayer(newMode);
      });

      const resetBtn = document.getElementById('reset-state');
      resetBtn.addEventListener('click', () => {
        resetFiltersAndSearch();
      });

      const fitBtn = document.getElementById('fit-all');
      fitBtn.addEventListener('click', () => {
        fitAllVisible();
      });

      const modal = document.getElementById('detail-modal');
      const closeModalBtn = document.getElementById('close-modal');
      closeModalBtn.addEventListener('click', closeDetailModal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeDetailModal();
      });
    });
  </script>
</body>
